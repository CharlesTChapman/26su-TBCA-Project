# ------------------------------------------------------------
# In this file, you can make some modifications to the Streamlit
# app's global environment. 
#
# All of the possible config options can be found here:
# https://docs.streamlit.io/develop/api-reference/configuration/config.toml
# ------------------------------------------------------------


[client]
# Turning the default sidebar navigation off so we 
# can use our own
showSidebarNavigation = false

[theme]
base                     = "dark"       # "light" or "dark" — the starting palette
primaryColor             = "#123293"    # accent: buttons, sliders, active widgets (kept)
backgroundColor          = "#0b1020"    # deep navy canvas (shares the primary's blue undertone)
secondaryBackgroundColor = "#161d31"    # slate-navy panels: sidebar, inputs, st.container
textColor                = "#dfe3ee"    # soft cool-white body text (high contrast on navy)
linkColor                = "#5b86e0"    # lighter blue tint of the primary — readable on dark
font                     = "serif"      # "sans serif" | "serif" | "monospace"
borderColor      = "#2a3450"
showWidgetBorder = true

[server]
runOnSave = true